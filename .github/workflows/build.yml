name: Build PON (Windows VST3 + macOS VST3/AU)

on:
  push:
  workflow_dispatch:      # Actions タブの "Run workflow" ボタンからも実行できる

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64 -DPON_BUILD_TESTS=ON

      - name: Build (Release)
        run: cmake --build build --config Release --parallel

      - name: Offline tests (null / block sizes / sample rates / stress / state)
        run: build\PONRenderTest_artefacts\Release\PONRenderTest.exe build\renders

      - name: pluginval (strictness 5)
        continue-on-error: true
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          .\pluginval\pluginval.exe --strictness-level 5 --validate-in-process --validate build\PON_artefacts\Release\VST3\PON.vst3
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Package ZIP
        shell: pwsh
        run: ./package.ps1 -SkipBuild

      - name: Upload VST3 (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: PON-windows
          path: |
            build/PON_artefacts/Release/VST3/PON.vst3
            dist/PON-*-win64.zip
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build universal VST3 + AU, run tests, ad-hoc sign, package
        run: |
          chmod +x package_mac.sh
          ./package_mac.sh --tests

      - name: auval (AU validation)
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build-mac/PON_artefacts/Release/AU/PON.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aufx Pon1 Pnfx

      - name: Upload VST3 + AU (macOS)
        uses: actions/upload-artifact@v4
        with:
          name: PON-mac
          path: |
            build-mac/PON_artefacts/Release/VST3/PON.vst3
            build-mac/PON_artefacts/Release/AU/PON.component
            dist/PON-*-mac.zip
          if-no-files-found: error
